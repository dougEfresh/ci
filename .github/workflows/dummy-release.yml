name: release
permissions:
  contents: write
  checks: write
  id-token: write
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version to release'
        required: true
        type: choice
        default: rc
        options:
          - patch
          - rc
          - minor
          - beta
          - alpha
          - major
          - release
jobs:
  releaser:
    name: release
    uses: ./.github/workflows/rust-release.yml
    secrets: inherit
    with:
      version: ${{ inputs.version }}
      package: 'dummy'
